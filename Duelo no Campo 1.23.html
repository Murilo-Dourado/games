<style>
/* Layout: cabeçalho curto, palco 16:10 com menus sobrepostos, legenda de teclas embaixo.
   Visual de caderno de campo militar: verde-oliva escuro, âmbar de sinalização, tipografia estêncil só no título. */
:root{
  --bg:#12150e; --panel:#1b2014; --panel2:#252d1a; --line:#3a4429; --grid:#1a1f13;
  --fg:#ebe7d2; --muted:#a3a88d; --accent:#e0a93b; --accent-ink:#1a1405;
  --blue:#6aa5f5; --red:#ea6a60;
  --display:'Black Ops One','Impact','Arial Black',sans-serif;
  --body:'Saira Condensed','Arial Narrow',sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--fg); font:500 17px/1.4 var(--body);
  padding-block:20px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:4px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font:400 clamp(26px,5vw,38px)/1 var(--display);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.top p{margin:0;font:400 14px var(--mono);color:var(--muted);letter-spacing:.04em}
.stage{display:grid;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#0a0c07}
.stage>*{grid-area:1/1;min-width:0}
canvas#cv{display:block;width:100%;height:auto;cursor:default}
canvas#cv.playing{cursor:none}
.ov{display:flex;padding:16px;overflow:auto;background:rgba(10,12,7,.84)}
.panel{margin:auto;width:min(100%,780px);display:grid;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:clamp(14px,3vw,24px)}
.panel.narrow{width:min(100%,460px);text-align:center}
.panel h2{margin:0;font:800 clamp(24px,4vw,32px)/1.05 var(--body);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{position:relative;display:grid;gap:6px;align-content:start;padding:10px;border:2px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.card input,.seg input{position:absolute;opacity:0;pointer-events:none}
.card:has(input:checked){border-color:var(--accent);background:var(--panel2)}
.card:has(input:focus-visible),.seg:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.thumb{display:block;width:100%;height:auto;border-radius:3px;border:1px solid var(--line)}
.card strong{font:800 21px/1.1 var(--body);letter-spacing:.03em;text-transform:uppercase}
.card span{color:var(--muted);font-size:15px;line-height:1.3}
.card em{font:400 13px var(--mono);font-style:normal;color:var(--accent);letter-spacing:.03em}
fieldset{margin:0;padding:0;border:0;min-width:0;display:grid;gap:8px}
legend{padding:0;margin-bottom:8px;font:700 14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg{position:relative;flex:1 1 110px;text-align:center;padding:9px 12px;border:2px solid var(--line);border-radius:4px;cursor:pointer;font:700 18px var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--bg)}
.seg:has(input:checked){border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.arsenal{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 14px var(--mono);color:var(--muted)}
.arsenal b{color:var(--fg);font-weight:400}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:800 20px var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);border-radius:4px;padding:11px 24px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.score{font:800 clamp(44px,9vw,72px)/1 var(--body);letter-spacing:.06em}
.score .me{color:var(--blue)} .score .cpu{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:0}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px}
.stats dt{font:400 12px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stats dd{margin:2px 0 0;font:800 26px var(--body);font-variant-numeric:tabular-nums}
.keys{display:flex;flex-wrap:wrap;gap:10px 22px;color:var(--muted);font-size:16px}
.keys span{display:inline-flex;align-items:center;gap:8px}
kbd{font:400 13px var(--mono);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:3px;padding:2px 7px;white-space:nowrap}
.note{display:none;margin:0;padding:10px 12px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);font:400 14px var(--mono)}
@media (pointer:coarse){.note{display:block}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ===== Modo aplicativo ===== */
:root{padding:0!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{padding:0!important;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:none;display:block}

.card{border-radius:16px}.seg{border-radius:999px}
.btn{border-radius:999px;min-height:48px}
#start{background:#3ddc84;border-color:#3ddc84;color:#06210f;font-size:24px;padding:12px 56px;box-shadow:0 4px 18px rgba(61,220,132,.35)}
.hero{display:flex;gap:14px;align-items:center}
.icon{flex:none;width:68px;height:68px;border-radius:16px;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ht{flex:1;min-width:0}.ht h1{margin:0;font:400 clamp(24px,4vw,34px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.ht p{margin:4px 0 0;font:400 13px var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font:700 13px var(--body);padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg)}
.fs{flex:none;align-self:flex-start;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:22px;cursor:pointer}
.hint{font:400 13px/1.5 var(--mono);color:var(--accent)!important;text-align:center}
.tc{display:none;position:absolute;inset:0;z-index:3;touch-action:none}
body.touch.playing .tc{display:block}
.zone{position:absolute;top:0;bottom:0;width:50%;touch-action:none}#zl{left:0}#zr{right:0}
.tb{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(20,24,14,.55);color:#fff;font-size:24px;touch-action:none}
#tcPause{top:max(10px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:46px;height:46px;font-size:15px}
.tbs{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:16px}.tbs .tb{position:static}
.jb,.jk{display:none;position:fixed;pointer-events:none;border-radius:50%;z-index:20}
.jb{width:140px;height:140px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.jk{width:56px;height:56px;background:rgba(224,169,59,.75);border:2px solid rgba(255,255,255,.6)}
#rot{display:none;position:fixed;inset:0;z-index:50;background:#12150e;color:var(--fg);flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 22px var(--body);text-align:center}
#rot div{font-size:64px;color:var(--accent)}#rot p{margin:0}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (max-height:520px){.panel{padding:12px;gap:10px}.card span,.card em{display:none}.thumb{max-height:70px;object-fit:cover}.chips{display:none}.icon{width:52px;height:52px}.maps{grid-template-columns:repeat(3,1fr)}}
</style>

            <canvas class="thumb" width="240" height="150"></canvas>
            <strong>Floresta Sinuosa</strong>

            <em>MUROS &middot; ÁRVORES &middot; RIO</em></label>
          <label class="card"><input type="radio" name="map" value="3">
            <canvas class="thumb" width="240" height="150"></canvas>
            <strong>Fogo e Gelo</strong>
            <span>Lava de um lado, gelo do outro, com pontes sobre os rios e brasas e neve no ar.</span>
            <em>LAVA &middot; GELO &middot; PONTES</em></label>
          <label class="card"><input type="radio" name="map" value="4">
            <canvas class="thumb" width="240" height="150"></canvas>
            <strong>Deserto do Oásis</strong>
            <span>Ruínas de pedra em volta de um oásis no centro do campo.</span>
            <em>RUÍNAS &middot; ARBUSTOS &middot; OÁSIS</em></label>
          <label class="card"><input type="radio" name="map" value="5">
            <canvas class="thumb" width="240" height="150"></canvas>
            <strong>Tundra Congelada</strong>
            <span>Neve caindo, lagos congelados e pinheiros para se esconder.</span>
            <em>NEVE &middot; PINHEIROS &middot; LAGOS</em></label>
        </div>
        <fieldset>
          <legend>Dificuldade da CPU</legend>
          <div class="segs">
            <label class="seg"><input type="radio" name="diff" value="easy">Fácil</label>

            <label class="seg"><input type="radio" name="diff" value="hard">Difícil</label>
          </div>
        </fieldset>
        <div class="arsenal"><span>Arsenal:</span><b>1 &middot; M4-05</b><b>2 &middot; Pistola</b><b>3 &middot; Faca</b></div>
        <p class="hint" id="hint"></p>
        <div class="actions"><button class="btn" id="start" type="button">Jogar</button></div>
      </div>
    </div>

    <div class="ov" id="pause" role="dialog" aria-label="Jogo pausado" hidden>
      <div class="panel narrow">
        <h2>Pausado</h2>
        <div class="actions">
          <button class="btn" id="resume" type="button">Continuar</button>
          <button class="btn ghost" id="toMenu" type="button">Trocar de campo</button>
        </div>
      </div>
    </div>

    <div class="ov" id="over" role="dialog" aria-label="Fim da partida" hidden>
      <div class="panel narrow">
        <h2 id="overTitle">Vitória</h2>
        <div class="score" id="overScore"><span class="me">0</span> x <span class="cpu">0</span></div>
        <dl class="stats" id="overStats"></dl>
        <div class="actions">
          <button class="btn" id="again" type="button">Jogar de novo</button>
          <button class="btn ghost" id="toMenu2" type="button">Menu</button>
        </div>
      </div>
    </div>
  </section>

  
</main>

<script>
(function(){

var $=function(id){return document.getElementById(id);};

var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function angDiff(a,b){var d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}

/* ---------- Definição dos mapas (retângulos [x,y,largura,altura]) ---------- */
var MAPDEFS=[

/* ---------- Geometria e colisão ---------- */
function circleRect(cx,cy,r,rc){var nx=clamp(cx,rc[0],rc[0]+rc[2]),ny=clamp(cy,rc[1],rc[1]+rc[3]);var dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}
function inRect(x,y,rc){return x>=rc[0]&&x<=rc[0]+rc[2]&&y>=rc[1]&&y<=rc[1]+rc[3];}
function blockedIn(m,x,y,r){
  if(x<r||x>W-r||y<r||y>H-r)return true;
  var i;
  for(i=0;i<m.walls.length;i++)if(circleRect(x,y,r,m.walls[i]))return true;
  for(i=0;i<m.trees.length;i++){var t=m.trees[i],dx=x-t.x,dy=y-t.y,rr=t.tr+r;if(dx*dx+dy*dy<rr*rr)return true;}
  for(i=0;i<m.rivers.length;i++){
    if(circleRect(x,y,r,m.rivers[i])){
      var on=false;
      for(var j=0;j<m.bridges.length;j++)if(inRect(x,y,m.bridges[j])){on=true;break;}
      if(!on)return true;
    }
  }
  return false;
}
function pointSolid(m,x,y){
  if(x<0||x>W||y<0||y>H)return true;
  var i;
  for(i=0;i<m.walls.length;i++)if(inRect(x,y,m.walls[i]))return true;
  for(i=0;i<m.trees.length;i++){var t=m.trees[i],dx=x-t.x,dy=y-t.y;if(dx*dx+dy*dy<t.tr*t.tr)return true;}
  return false;
}
function los(m,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),n=Math.ceil(d/8);
  for(var i=1;i<n;i++){var t=i/n;if(pointSolid(m,x1+dx*t,y1+dy*t))return false;}
  return true;
}
function safeSpot(m,x,y){

/* ---------- Pré-renderização do cenário ---------- */
function mkCanvas(){var c=document.createElement('canvas');c.width=W;c.height=H;return c;}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}

function renderStatic(m){
  var bg=mkCanvas(),g=bg.getContext('2d'),R=rng(m.idx*977+13),P=m.pal,i,k,rc,t;
  g.fillStyle=P.grass;g.fillRect(0,0,W,H);if(P.split){g.fillStyle=P.grass2;g.fillRect(W/2,0,W/2,H);}
  for(i=0;i<260;i++){
    var ex=R()*W,ey=R()*H,ic=P.split&&ex>W/2;
    g.fillStyle='hsla('+((ic?P.hue2:P.hue)+R()*24-12)+','+(28+R()*14)+'%,'+((ic?P.l2:P.l)+R()*10-5)+'%,.35)';
    g.beginPath();g.ellipse(ex,ey,20+R()*60,14+R()*40,R()*3,0,TAU);g.fill();
  }
  g.lineWidth=1;
  for(i=0;i<1500;i++){
    var x=R()*W,y=R()*H;
    g.strokeStyle=R()<.5?'rgba(0,0,0,.13)':'rgba(255,255,255,.07)';
    g.beginPath();g.moveTo(x,y);g.lineTo(x+R()*4-2,y-3-R()*4);g.stroke();
  }
  /* rios: margens, depois água */
  for(i=0;i<m.rivers.length;i++){rc=m.rivers[i];g.fillStyle=(P.lava&&rc[0]+rc[2]/2<W/2)?P.bankL:P.bank;g.fillRect(rc[0]-9,rc[1]-9,rc[2]+18,rc[3]+18);}
  for(i=0;i<m.rivers.length;i++){
    rc=m.rivers[i];
    g.fillStyle=(P.lava&&rc[0]+rc[2]/2<W/2)?P.lava:P.water;g.fillRect(rc[0],rc[1],rc[2],rc[3]);
  }
  for(i=0;i<m.rivers.length;i++){
    rc=m.rivers[i];
    g.fillStyle='rgba(255,255,255,.05)';g.fillRect(rc[0]+6,rc[1]+6,rc[2]-12,rc[3]-12);
  }
  /* sombras de muros e árvores */
  g.fillStyle='rgba(0,0,0,.3)';
  for(i=0;i<m.walls.length;i++){rc=m.walls[i];g.fillRect(rc[0]+5,rc[1]+6,rc[2],rc[3]);}
  g.fillStyle='rgba(0,0,0,.24)';
  for(i=0;i<m.trees.length;i++){t=m.trees[i];g.beginPath();g.ellipse(t.x+9,t.y+11,t.r,t.r*.9,0,0,TAU);g.fill();}
  /* muros de pedra */
  for(i=0;i<m.walls.length;i++){
    rc=m.walls[i];
    g.fillStyle='#8c887c';g.fillRect(rc[0],rc[1],rc[2],rc[3]);
    g.save();g.beginPath();g.rect(rc[0],rc[1],rc[2],rc[3]);g.clip();
    g.strokeStyle='#5f5c53';g.lineWidth=1;
    var row=0;
    for(var yy=rc[1];yy<rc[1]+rc[3];yy+=10,row++){
      g.beginPath();g.moveTo(rc[0],yy+.5);g.lineTo(rc[0]+rc[2],yy+.5);g.stroke();
      for(var xx=rc[0]+(row%2?10:0);xx<rc[0]+rc[2];xx+=20){g.beginPath();g.moveTo(xx+.5,yy);g.lineTo(xx+.5,yy+10);g.stroke();}
    }
    g.restore();
    g.strokeStyle='#bab6a8';g.lineWidth=1;g.strokeRect(rc[0]+1.5,rc[1]+1.5,rc[2]-3,rc[3]-3);
    g.strokeStyle='#3c3a34';g.lineWidth=2;g.strokeRect(rc[0],rc[1],rc[2],rc[3]);
  }
  /* troncos */
  for(i=0;i<m.trees.length;i++){
    t=m.trees[i];
    g.fillStyle='#4f351d';circ(g,t.x,t.y,t.tr);
    g.fillStyle='#6b4a29';circ(g,t.x-1,t.y-1,t.tr*.65);
  }
  m.bg=bg;

  /* pontes (camada própria, desenhada depois do brilho da água) */
  var br=mkCanvas(),b=br.getContext('2d');
  for(i=0;i<m.bridges.length;i++){
    rc=m.bridges[i];
    b.fillStyle='rgba(0,0,0,.3)';b.fillRect(rc[0]+4,rc[1]+5,rc[2],rc[3]);
    b.fillStyle='#8b6338';b.fillRect(rc[0],rc[1],rc[2],rc[3]);
    b.strokeStyle='#5b3f22';b.lineWidth=2;
    if(rc[2]>=rc[3]){
      for(var px=rc[0]+6;px<rc[0]+rc[2];px+=12){b.beginPath();b.moveTo(px,rc[1]);b.lineTo(px,rc[1]+rc[3]);b.stroke();}
      b.fillStyle='#4a331b';b.fillRect(rc[0],rc[1],rc[2],5);b.fillRect(rc[0],rc[1]+rc[3]-5,rc[2],5);
    }else{
      for(var py=rc[1]+6;py<rc[1]+rc[3];py+=12){b.beginPath();b.moveTo(rc[0],py);b.lineTo(rc[0]+rc[2],py);b.stroke();}
      b.fillStyle='#4a331b';b.fillRect(rc[0],rc[1],5,rc[3]);b.fillRect(rc[0]+rc[2]-5,rc[1],5,rc[3]);
    }
  }
  m.br=br;

  /* copas das árvores (camada desenhada por cima dos personagens) */
  var cr=mkCanvas(),c=cr.getContext('2d');
  for(i=0;i<m.trees.length;i++){
    t=m.trees[i];var R2=rng(t.seed);
    var pp=m.pal,qq=pp.split?(t.x<W/2?1:2):0,th=pp.th||0,tl=pp.tl||0,H1,H2,H3,S1,L1,L2,L3;
    if(qq===1){H1=H2=8;H3=38;S1=70;L1=14;L2=22;L3=38;}else if(qq===2){H1=H2=H3=198;S1=55;L1=62;L2=74;L3=88;}
    else{H1=128+th+R2()*14;H2=122+th+R2()*16;H3=100+th+R2()*20;S1=44;L1=19+tl+R2()*5;L2=28+tl+R2()*6;L3=38+tl+R2()*6;}
    c.fillStyle='hsl('+H1+','+S1+'%,'+L1+'%)';circ(c,t.x,t.y,t.r);
    c.fillStyle='hsl('+H2+','+S1+'%,'+L2+'%)';circ(c,t.x-t.r*.18,t.y-t.r*.2,t.r*.78);
    c.fillStyle='hsl('+H3+','+S1+'%,'+L3+'%)';circ(c,t.x-t.r*.3,t.y-t.r*.32,t.r*.4);
  }
  m.crown=cr;
}

function buildMap(def,idx){
  var m={idx:idx,name:def.name,walls:def.walls,rivers:def.rivers,bridges:def.bridges,pal:def.pal,sp:def.sp,trees:[]};
  var R=rng(def.trees.seed),T=def.trees,tries=0,placed=0;
  function valid(x,y,r){
    var k=r*.45,i;
    for(i=0;i<m.walls.length;i++)if(circleRect(x,y,k+16,m.walls[i]))return false;
    for(i=0;i<m.rivers.length;i++)if(circleRect(x,y,k+28,m.rivers[i]))return false;
    for(i=0;i<m.bridges.length;i++)if(circleRect(x,y,k+44,m.bridges[i]))return false;
    for(i=0;i<m.sp.length;i++)if(Math.hypot(x-m.sp[i][0],y-m.sp[i][1])<120)return false;
    for(i=0;i<m.trees.length;i++)if(Math.hypot(x-m.trees[i].x,y-m.trees[i].y)<(r+m.trees[i].r)*.78)return false;
    return true;
  }
  while(placed<T.n&&tries++<6000){
    var r=T.rmin+R()*(T.rmax-T.rmin);
    var x=T.mirror?40+R()*(W/2-110):40+R()*(W-80),y=40+R()*(H-80);
    if(!valid(x,y,r))continue;
    if(T.mirror&&!valid(W-x,y,r))continue;
    m.trees.push({x:x,y:y,r:r,tr:r*.38,seed:(R()*1e9)|0});
    if(T.mirror)m.trees.push({x:W-x,y:y,r:r,tr:r*.38,seed:(R()*1e9)|0});
    placed++;
  }
  m.sp=def.sp.map(function(p){return safeSpot(m,p[0],p[1]);});
  m.grid=new Uint8Array(GW*GH);
  for(var cy=0;cy<GH;cy++)for(var cx=0;cx<GW;cx++)m.grid[cy*GW+cx]=blockedIn(m,cx*CELL+CELL/2,cy*CELL+CELL/2,14)?1:0;
  renderStatic(m);
  return m;
}
var maps=MAPDEFS.map(buildMap);

  {id:'m4',name:'M4-05',type:'gun',auto:true,mag:30,reserve:120,rate:.085,rel:1.7,dmg:20,spd:1000,spread:.03,kick:.012,maxSpread:.09,range:950,len:36},
  {id:'pistol',name:'Pistola',type:'gun',auto:false,mag:12,reserve:60,rate:.27,rel:1.1,dmg:28,spd:900,spread:.02,kick:.02,maxSpread:.06,range:700,len:20},

/* ---------- Som (sintetizado, sem arquivos) ---------- */
var AC=null,muted=false,noiseBuf=null;
function actx(){
  if(!AC){
    var Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return null;
    AC=new Ctor();var n=Math.floor(AC.sampleRate*.3);
    noiseBuf=AC.createBuffer(1,n,AC.sampleRate);var d=noiseBuf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function noise(freq,dur,gain,type){
  var a=actx();if(!a||muted)return;
  var s=a.createBufferSource();s.buffer=noiseBuf;
  var f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;
  var g=a.createGain();g.gain.setValueAtTime(gain,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+dur);
}
function tone(freq,dur,gain,type){
  var a=actx();if(!a||muted)return;
  var o=a.createOscillator();o.type=type||'square';o.frequency.value=freq;
  var g=a.createGain();g.gain.setValueAtTime(gain,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);
}
function snd(k,v){
  v=v==null?1:v;
  try{
    if(k==='m4')noise(2200,.09,.3*v);
    else if(k==='pistol'){noise(3000,.13,.38*v);tone(120,.08,.12*v,'sine');}
    else if(k==='knife')noise(1800,.14,.16*v,'bandpass');
    else if(k==='hit')noise(500,.1,.4*v);
    else if(k==='reload'){tone(180,.05,.12*v);setTimeout(function(){tone(260,.05,.12*v);},320);}
    else if(k==='empty')tone(90,.04,.1*v);
    else if(k==='swap')tone(320,.04,.07*v);
  }catch(e){}
}
function vol(f){return f.isP?1:clamp(1-Math.hypot(f.x-P.x,f.y-P.y)/900,.15,.8);}

/* ---------- Combatentes ---------- */
function mkF(isP){
  return {isP:isP,x:0,y:0,a:0,hp:100,r:14,dead:false,respawn:0,inv:0,wi:0,ammo:[],cd:0,rel:0,swing:0,flash:0,spread:0,swapT:0,hurt:0,kills:0,deaths:0,
    seenT:0,lostT:99,last:null,burst:0,pause:0,strafe:1,strafeT:0,offT:0,off:0,stuckT:0,tgt:null,field:null,q:null,fcell:-1,px:0,py:0};
}
function opp(f){return f===P?C:P;}
function resetAmmo(f){f.ammo=WDEF.map(function(w){return w.type==='gun'?{mag:w.mag,res:w.reserve}:null;});}
function spawnF(f,initial,slot){
  var o=opp(f),pt;
  if(initial)pt=M.sp[slot];
  else{
    var list=M.sp.slice().sort(function(a,b){return Math.hypot(b[0]-o.x,b[1]-o.y)-Math.hypot(a[0]-o.x,a[1]-o.y);});
    pt=list[Math.floor(Math.random()*2)];
  }
  f.x=pt[0];f.y=pt[1];f.hp=100;f.dead=false;f.inv=1.5;f.wi=0;f.rel=0;f.cd=.3;f.swing=0;f.flash=0;f.spread=0;f.swapT=0;f.hurt=0;
  f.seenT=0;f.lostT=99;f.last=null;f.tgt=null;f.burst=0;f.pause=0;f.fcell=-1;
  resetAmmo(f);
  f.a=Math.atan2(H/2-f.y,W/2-f.x);
}
function cellIdx(x,y){return clamp(Math.floor(y/CELL),0,GH-1)*GW+clamp(Math.floor(x/CELL),0,GW-1);}
function tryMove(f,dx,dy){
  if(!blockedIn(M,f.x+dx,f.y,f.r))f.x+=dx;
  if(!blockedIn(M,f.x,f.y+dy,f.r))f.y+=dy;
}
function switchW(f,i){
  if(i===f.wi||f.swapT>0||f.dead)return;
  f.wi=i;f.rel=0;f.swapT=.3;f.spread=0;
  if(f.isP)snd('swap');
}
function startReload(f){
  var w=WDEF[f.wi];if(w.type!=='gun')return;
  var a=f.ammo[f.wi];
  if(f.rel>0||a.mag>=w.mag||a.res<=0)return;

}
function finishReload(f){
  var w=WDEF[f.wi];if(w.type!=='gun')return;
  var a=f.ammo[f.wi],take=Math.min(w.mag-a.mag,a.res);
  a.mag+=take;a.res-=take;
}

/* ---------- Partículas e marcas ---------- */
function addPart(x,y,vx,vy,life,col,sz,kind){parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,col:col,sz:sz,kind:kind||'dot'});}
function sparks(x,y,n,col){for(var i=0;i<n;i++){var a=Math.random()*TAU,s=60+Math.random()*180;addPart(x,y,Math.cos(a)*s,Math.sin(a)*s,.25+Math.random()*.2,col||'#ffd27a',2,'line');}}
function blood(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*TAU,s=40+Math.random()*140;addPart(x,y,Math.cos(a)*s,Math.sin(a)*s,.4+Math.random()*.4,'#a3201c',2+Math.random()*2.5,'dot');}}
function stain(x,y,r,col,al){dctx.globalAlpha=al;dctx.fillStyle=col;dctx.beginPath();dctx.arc(x,y,r,0,TAU);dctx.fill();dctx.globalAlpha=1;}
function casing(f){
  var a=f.a+Math.PI/2;
  addPart(f.x+Math.cos(f.a)*10,f.y+Math.sin(f.a)*10,Math.cos(a)*(70+Math.random()*40),Math.sin(a)*(70+Math.random()*40),.7,'#d4b04a',2.5,'dot');
}
function setMsg(t,c){msg=t;msgT=2.4;msgCol=c||'#fff';}

/* ---------- Disparos e dano ---------- */
function dmgMul(f){return f.isP?1:DIFF[diff].dmg;}
function shoot(f){
  var w=WDEF[f.wi];
  if(f.dead||f.swapT>0)return false;
  if(w.type==='melee'){
    if(f.cd>0)return false;
    f.cd=w.rate;f.swing=.22;snd('knife',vol(f));
    var o=opp(f);
    if(!o.dead&&o.inv<=0){
      var d=Math.hypot(o.x-f.x,o.y-f.y);
      if(d<w.reach+o.r&&Math.abs(angDiff(f.a,Math.atan2(o.y-f.y,o.x-f.x)))<w.arc/2&&los(M,f.x,f.y,o.x,o.y)){
        hit(f,o,w.dmg*dmgMul(f),w);
        if(f.isP){stats.hits++;}
      }
    }
    if(f.isP)stats.shots++;
    return true;
  }
  if(f.cd>0||f.rel>0)return false;
  var a=f.ammo[f.wi];
  if(a.mag<=0){
    if(a.res>0)startReload(f);else if(f.isP)snd('empty',1);
    f.cd=.25;return false;
  }
  a.mag--;f.cd=w.rate;f.flash=.06;
  var ang=f.a+(Math.random()*2-1)*(w.spread+f.spread);
  f.spread=Math.min(w.maxSpread,f.spread+w.kick);
  bullets.push({x:f.x+Math.cos(f.a)*22,y:f.y+Math.sin(f.a)*22,vx:Math.cos(ang)*w.spd,vy:Math.sin(ang)*w.spd,o:f,dmg:w.dmg*dmgMul(f),life:w.range/w.spd,w:w});
  if(f.isP){stats.shots++;if(!reduceMotion)shake=Math.max(shake,w.id==='m4'?2:3);}
  casing(f);snd(w.id,vol(f));
  if(a.mag<=0&&a.res>0)startReload(f);
  return true;
}
function hit(att,vic,dmg,w){
  vic.hp-=dmg;vic.hurt=.2;
  blood(vic.x,vic.y,6);snd('hit',att.isP||vic.isP?1:.5);
  stain(vic.x+(Math.random()*16-8),vic.y+(Math.random()*16-8),2+Math.random()*3,'#7d1612',.5);
  if(vic.isP){hurtFlash=.4;if(!reduceMotion)shake=Math.max(shake,5);}
  if(vic.hp<=0)kill(att,vic,w);
}
function kill(att,vic,w){
  vic.dead=true;vic.respawn=2.2;vic.rel=0;att.kills++;vic.deaths++;
  stain(vic.x,vic.y,20,'#5a0f0c',.55);
  stain(vic.x,vic.y,11,vic.isP?COL.p.body:COL.c.body,.7);
  blood(vic.x,vic.y,22);
  setMsg(att.isP?'Você eliminou a CPU  ·  '+w.name:'A CPU eliminou você  ·  '+w.name,att.isP?'#8fc3ff':'#ff8f86');
  if(att.kills>=WIN)endMatch();
}
function updBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i],steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/8)),sx=b.vx*dt/steps,sy=b.vy*dt/steps,dead=false;
    for(var s=0;s<steps;s++){
      b.x+=sx;b.y+=sy;
      if(pointSolid(M,b.x,b.y)){sparks(b.x,b.y,5);dead=true;break;}
      var t=opp(b.o);
      if(!t.dead&&Math.hypot(t.x-b.x,t.y-b.y)<t.r+1){
        if(t.inv<=0){hit(b.o,t,b.dmg,b.w);if(b.o.isP)stats.hits++;}
        dead=true;break;
      }
    }
    b.life-=dt;
    if(dead||b.life<=0)bullets.splice(i,1);
  }
}
function updFx(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-4*dt;p.vy*=1-4*dt;
  }
  if(msgT>0)msgT-=dt;
  if(hurtFlash>0)hurtFlash-=dt;
  shake=Math.max(0,shake-dt*20);
}
function timers(f,dt){
  if(f.cd>0)f.cd-=dt;
  if(f.rel>0){f.rel-=dt;if(f.rel<=0){f.rel=0;finishReload(f);}}
  if(f.swing>0)f.swing-=dt;
  if(f.flash>0)f.flash-=dt;
  if(f.swapT>0)f.swapT-=dt;
  if(f.hurt>0)f.hurt-=dt;
  if(f.inv>0)f.inv-=dt;
  f.spread=Math.max(0,f.spread-dt*.09);
}

/* ---------- Jogador ---------- */
function playerUpdate(f,dt){
  if(f.dead){f.mvx=f.mvy=0;return;}
  var mx=((keys.d||pk.d)?1:0)-((keys.a||pk.a)?1:0),my=((keys.s||pk.s)?1:0)-((keys.w||pk.w)?1:0),l=Math.hypot(mx,my),sp=SPEED[f.wi];
  var am=Math.hypot(ana.x,ana.y),tx=0,ty=0;
  if(am>0){var q=Math.max(1,am);tx=ana.x/q*sp;ty=ana.y/q*sp;}else if(l>0){tx=mx/l*sp;ty=my/l*sp;}
  var kk=1-Math.exp(-dt*18);f.mvx=(f.mvx||0)+(tx-(f.mvx||0))*kk;f.mvy=(f.mvy||0)+(ty-(f.mvy||0))*kk;
  if(Math.abs(f.mvx)>.5||Math.abs(f.mvy)>.5)tryMove(f,f.mvx*dt,f.mvy*dt);
  f.a=Math.atan2(mouse.y-f.y,mouse.x-f.x);
  var w=WDEF[f.wi];
  if(w.type==='melee'){if(mouse.down||mouse.buf>0){if(shoot(f))mouse.buf=0;}}
  else if(w.auto){if(mouse.down)shoot(f);}
  else if(mouse.buf>0){if(shoot(f))mouse.buf=0;}
  if(mouse.buf>0)mouse.buf-=dt;
}

/* ---------- CPU: campo de distâncias (BFS) para contornar muros e rios ---------- */
function nearestFree(c){
  var cx=c%GW,cy=(c/GW)|0;
  for(var r=1;r<8;r++)for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++){
    var nx=cx+dx,ny=cy+dy;
    if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
    if(!M.grid[ny*GW+nx])return ny*GW+nx;
  }
  return -1;
}
function buildField(f,tx,ty){
  var g=M.grid,dist=f.field||(f.field=new Int16Array(GW*GH)),q=f.q||(f.q=new Int16Array(GW*GH));
  dist.fill(-1);
  var c=cellIdx(tx,ty);
  f.fcell=c;
  if(g[c]){c=nearestFree(c);if(c<0)return;}
  var h=0,t=0;q[t++]=c;dist[c]=0;
  while(h<t){
    var cur=q[h++],cx=cur%GW,cy=(cur/GW)|0,d=dist[cur];
    for(var k=0;k<8;k++){
      var nx=cx+DX[k],ny=cy+DY[k];
      if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
      var ni=ny*GW+nx;
      if(g[ni]||dist[ni]>=0)continue;
      if(DX[k]&&DY[k]&&(g[cy*GW+nx]||g[ny*GW+cx]))continue;
      dist[ni]=d+1;q[t++]=ni;
    }
  }
}
function pathDir(f){
  var g=M.grid,dist=f.field,c=cellIdx(f.x,f.y),cx=c%GW,cy=(c/GW)|0;
  var bd=dist[c]>=0?dist[c]:99999,best=-1;
  for(var k=0;k<8;k++){
    var nx=cx+DX[k],ny=cy+DY[k];
    if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
    var ni=ny*GW+nx;
    if(dist[ni]<0)continue;
    if(DX[k]&&DY[k]&&(g[cy*GW+nx]||g[ny*GW+cx]))continue;
    if(dist[ni]<bd){bd=dist[ni];best=ni;}
  }
  if(best<0)return null;
  var tx=((best%GW)+.5)*CELL-f.x,ty=(((best/GW)|0)+.5)*CELL-f.y,l=Math.hypot(tx,ty)||1;
  return [tx/l,ty/l];
}
function randomFree(){
  for(var i=0;i<60;i++){var x=40+Math.random()*(W-80),y=40+Math.random()*(H-80);if(!blockedIn(M,x,y,16))return {x:x,y:y};}
  return {x:W/2,y:H/2};
}

function aiUpdate(f,dt){
  if(f.dead)return;
  var Pl=opp(f),D=DIFF[diff];
  var dx=Pl.x-f.x,dy=Pl.y-f.y,dist=Math.hypot(dx,dy)||1;
  var see=!Pl.dead&&dist<780&&los(M,f.x,f.y,Pl.x,Pl.y);
  if(see){f.seenT+=dt;f.lostT=0;f.last={x:Pl.x,y:Pl.y};}else{f.seenT=0;f.lostT+=dt;}
  f.offT-=dt;
  if(f.offT<=0){f.offT=.35+Math.random()*.4;f.off=(Math.random()*2-1)*D.err;}

  /* escolha de arma */
  if(f.swapT<=0){
    var m4=f.ammo[0],pi=f.ammo[1],want;
    if(see&&dist<85)want=2;
    else if(see){
      if(m4.mag>0)want=0;else if(pi.mag>0)want=1;else if(m4.res>0)want=0;else if(pi.res>0)want=1;else want=2;
    }else{
      if(m4.mag>0||m4.res>0)want=0;else if(pi.mag>0||pi.res>0)want=1;else want=2;
    }
    if(want!==f.wi)switchW(f,want);
  }
  var w=WDEF[f.wi];
  if(!see&&f.rel<=0&&w.type==='gun'){var am=f.ammo[f.wi];if(am.mag<w.mag*.5&&am.res>0)startReload(f);}

  /* mira */
  var aimAng=Math.atan2(dy,dx);
  if(see){
    var da=angDiff(f.a,aimAng+f.off);
    f.a+=clamp(da,-D.turn*dt,D.turn*dt);
  }

  /* movimento */
  var mx=0,my=0,sp=SPEED[f.wi]*D.spd;
  if(see){
    var ux=dx/dist,uy=dy/dist;
    f.strafeT-=dt;
    if(f.strafeT<=0){f.strafeT=.8+Math.random()*1.4;f.strafe=Math.random()<.5?-1:1;}
    if(f.wi===2){mx=ux;my=uy;}
    else{
      var rad=dist>380?1:(dist<190?-1:.15);
      mx=ux*rad+(-uy)*f.strafe*.9;my=uy*rad+ux*f.strafe*.9;
    }
  }else{
    var tg=(f.last&&f.lostT<7)?f.last:f.tgt;
    if(!tg||Math.hypot(tg.x-f.x,tg.y-f.y)<35){
      f.last=null;
      if(Math.random()<.7&&!Pl.dead){var o=randomFree();tg={x:clamp(Pl.x+(Math.random()*2-1)*220,40,W-40),y:clamp(Pl.y+(Math.random()*2-1)*220,40,H-40)};
        if(blockedIn(M,tg.x,tg.y,16))tg=o;}
      else tg=randomFree();
      f.tgt=tg;
    }
    if(cellIdx(tg.x,tg.y)!==f.fcell||!f.field)buildField(f,tg.x,tg.y);
    var dir=pathDir(f);
    if(dir){mx=dir[0];my=dir[1];}
    else{var tl=Math.hypot(tg.x-f.x,tg.y-f.y)||1;mx=(tg.x-f.x)/tl;my=(tg.y-f.y)/tl;}
    var wa=Math.atan2(my,mx);
    f.a+=clamp(angDiff(f.a,wa),-6*dt,6*dt);
  }
  var l=Math.hypot(mx,my);
  if(l>0){
    var bx=f.x,by=f.y;
    tryMove(f,mx/l*sp*dt,my/l*sp*dt);
    if(Math.hypot(f.x-bx,f.y-by)<sp*dt*.25){f.stuckT+=dt;}else f.stuckT=0;
    if(f.stuckT>.5){f.stuckT=0;f.strafe*=-1;f.strafeT=1;if(!see)f.tgt=randomFree();}
  }

  /* tiro */
  if(see&&f.seenT>D.react){
    var diffA=Math.abs(angDiff(f.a,aimAng));
    if(f.wi===2){if(dist<w.reach+32)shoot(f);}
    else if(diffA<.1&&dist<(f.wi===0?680:460)){
      if(f.wi===0){
        if(f.pause>0)f.pause-=dt;
        else{
          if(f.burst<=0)f.burst=3+Math.floor(Math.random()*5);
          if(shoot(f)){f.burst--;if(f.burst<=0)f.pause=D.pause*(.6+Math.random()*.8);}
        }
      }else if(Math.random()<.9)shoot(f);
    }
  }
}

/* ---------- Atualização geral ---------- */
function updateGame(dt){
  if(intro>0){intro-=dt;updFx(dt);return;}
  matchT+=dt;
  timers(P,dt);timers(C,dt);
  playerUpdate(P,dt);aiUpdate(C,dt);
  if(!P.dead&&!C.dead){
    var dx=C.x-P.x,dy=C.y-P.y,d=Math.hypot(dx,dy),mn=P.r+C.r;
    if(d<mn&&d>0){var push=(mn-d)/2,nx=dx/d,ny=dy/d;tryMove(P,-nx*push,-ny*push);tryMove(C,nx*push,ny*push);}
  }
  updBullets(dt);updFx(dt);
  for(var i=0;i<2;i++){
    var f=fighters[i];
    if(f.dead&&state==='play'){f.respawn-=dt;if(f.respawn<=0)spawnF(f,false);}
  }
}

function drawF(f){

/* ---------- Cenário animado ---------- */
function drawWater(t){
  for(var i=0;i<M.rivers.length;i++){
    var rc=M.rivers[i],vertical=rc[2]<rc[3];
    ctx.save();ctx.beginPath();ctx.rect(rc[0],rc[1],rc[2],rc[3]);ctx.clip();
    var lava=M.pal.lava&&rc[0]+rc[2]/2<W/2;if(lava){ctx.fillStyle='rgba(255,120,30,'+(.1+.07*Math.sin(t*2+i))+')';ctx.fillRect(rc[0],rc[1],rc[2],rc[3]);}
    ctx.strokeStyle=lava?'rgba(255,214,110,.8)':'rgba(255,255,255,.2)';ctx.lineWidth=2;
    var span=(vertical?rc[3]:rc[2])+40,lanes=(vertical?rc[2]:rc[3]);
    for(var j=0;j<Math.floor(span/34);j++){
      var lane=((j*53+i*17)%Math.max(1,Math.floor(lanes/12)))*12+8;
      var pos=((t*38+j*34+i*61)%span)-20;
      ctx.beginPath();
      if(vertical){ctx.moveTo(rc[0]+lane,rc[1]+pos);ctx.lineTo(rc[0]+lane+3,rc[1]+pos+14);}
      else{ctx.moveTo(rc[0]+pos,rc[1]+lane);ctx.lineTo(rc[0]+pos+14,rc[1]+lane+3);}
      ctx.stroke();
    }
    ctx.restore();
  }
}

function ambient(t){

  for(var i=0;i<52;i++){

    if(P.split)x=ember?x0%600:600+x0%600;else x=x0;
    y=ember?H-((t*sp*1.3+i*97)%H):((t*sp*.7+i*97)%H);

  }
}
